spring.datasource.url=jdbc:postgresql://localhost:5432/aso_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns the schema (SQL migrations). Hibernate only validates entities match the DB —
# never auto-creates/alters tables (safer than ddl-auto=update in a real project).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Prevents Hibernate from keeping the session open during view/JSON rendering (classic LazyInit trap).
# Repositories that return graphs for the API therefore use JOIN FETCH (*WithDetails queries).
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:noreply@aso-service.local}
app.email-renderer.url=${EMAIL_RENDERER_URL:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.account-token.password-reset-ttl-seconds=${APP_PASSWORD_RESET_TTL_SECONDS:3600}
app.account-token.email-verification-ttl-seconds=${APP_EMAIL_VERIFICATION_TTL_SECONDS:86400}

# HMAC secret for JWT signing (override in production via APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:aso-service-dev-jwt-secret-change-me-32chars-min}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Transactional email outbox: PENDING rows survive crashes; poller retries with backoff.
app.email-outbox.poll-interval-ms=${APP_EMAIL_OUTBOX_POLL_MS:5000}
app.email-outbox.batch-size=${APP_EMAIL_OUTBOX_BATCH_SIZE:20}
