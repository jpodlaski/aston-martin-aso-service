spring.datasource.url=jdbc:postgresql://localhost:5432/aso_service_test
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mail.host=localhost
spring.mail.port=25
app.mail.from=test@aso.local
app.email-renderer.url=http://localhost:9
app.frontend-url=http://localhost:5173

app.jwt.secret=aso-service-test-jwt-secret-change-me-32chars-min
app.jwt.expiration-ms=3600000
