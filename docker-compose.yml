# Local full-stack demo: Postgres + Mailhog (fake SMTP UI) + Clojure email renderer + Spring API + Vite UI.
# First start: ./mvnw package -DskipTests && docker compose up -d --build
# Daily restart: docker compose start   (or use Docker Desktop — containers stay listed)
# Stop without removing: docker compose stop
# Fresh DB: docker compose down && rm -rf pgdata && ./mvnw package -DskipTests && docker compose up -d --build
name: aston-martin-aso
services:
  db:
    image: postgres:16
    container_name: aso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aso_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - type: bind
        source: ./pgdata
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aso_service_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    container_name: aso-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  email-renderer:
    build:
      context: ./clojure/email-renderer
    container_name: aso-email-renderer
    restart: unless-stopped
    ports:
      - "3000:3000"

  app:
    build: .
    container_name: aso-service-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      email-renderer:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aso_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@aston-martin-aso.local
      EMAIL_RENDERER_URL: http://email-renderer:3000
      APP_FRONTEND_URL: http://localhost:5173
      APP_JWT_SECRET: aso-service-dev-jwt-secret-change-me-32chars-min
      APP_JWT_EXPIRATION_MS: "86400000"

  frontend:
    build:
      context: ./aso-frontend
    container_name: aso-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "5173:5173"
    volumes:
      - ./aso-frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend_node_modules:
